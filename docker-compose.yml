# =============================================================================
# nutrIAprova — Stack de Infraestrutura Local (Fase 1, "Modo Deus")
# -----------------------------------------------------------------------------
# Objetivo: subir todo o ecossistema de dados + IA local em Docker para que o
# backend futuro (Express em /api — ainda não criado nesta fase) consuma tudo
# daqui. O frontend React continua apontando para o Supabase Cloud até a Fase 2.
#
# Serviços:
#   nutriaprova-db  → Postgres 15, banco da aplicação (host: localhost:5433)
#   n8n-db          → Postgres 15, banco EXCLUSIVO do n8n (interno ao compose)
#   n8n             → Orquestrador de agentes/workflows (localhost:5678)
#   ollama          → Runtime de LLM local (localhost:11434)
#   redis           → Fila + cache (localhost:6379)
#
# Variáveis: ver `.env.local` na raiz do projeto (não commitar).
# =============================================================================

services:
  # ─────────────────────────────────────────────────────────────────────────
  # Postgres da APLICAÇÃO nutrIAprova (futuro substituto do Supabase Cloud).
  # Exposto em 5433 no host para não colidir com um Postgres local em 5432.
  # ─────────────────────────────────────────────────────────────────────────
  nutriaprova-db:
    image: postgres:15-alpine
    container_name: nutriaprova-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${APP_DB_NAME:-nutriaprova}
      POSTGRES_USER: ${APP_DB_USER:-nutriaprova}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?defina APP_DB_PASSWORD no .env.local}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "5433:5432"
    volumes:
      - nutriaprova_db_data:/var/lib/postgresql/data
    networks:
      - nutriaprova-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_DB_USER:-nutriaprova} -d ${APP_DB_NAME:-nutriaprova}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────────────────────────────────
  # Postgres dedicado ao n8n (metadata de workflows, execuções, credenciais).
  # NÃO expõe porta no host — só o n8n fala com ele pela rede interna.
  # ─────────────────────────────────────────────────────────────────────────
  n8n-db:
    image: postgres:15-alpine
    container_name: nutriaprova-n8n-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${N8N_DB_NAME:-n8n}
      POSTGRES_USER: ${N8N_DB_USER:-n8n}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD:?defina N8N_DB_PASSWORD no .env.local}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - n8n_db_data:/var/lib/postgresql/data
    networks:
      - nutriaprova-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${N8N_DB_USER:-n8n} -d ${N8N_DB_NAME:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─────────────────────────────────────────────────────────────────────────
  # n8n — Orquestrador de agentes. Persiste metadata em n8n-db (Postgres) e
  # arquivos em volume nomeado. A pasta `./n8n-workflows` é montada p/ que
  # workflows exportados (.json) versionados no repo fiquem disponíveis.
  # ─────────────────────────────────────────────────────────────────────────
  n8n:
    image: n8nio/n8n:1.71.3
    container_name: nutriaprova-n8n
    restart: unless-stopped
    depends_on:
      n8n-db:
        condition: service_healthy
    ports:
      - "5678:5678"
    environment:
      # Auth básica (trocar em produção).
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:?defina N8N_PASSWORD no .env.local}

      # Host / URLs.
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: ${N8N_WEBHOOK_URL:-http://localhost:5678/}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_URL:-http://localhost:5678/}

      # Persistência em Postgres dedicado.
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD}

      # Encryption key das credenciais salvas no n8n. MUITO importante: manter
      # fixa entre restarts, senão credenciais salvas viram lixo.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?defina N8N_ENCRYPTION_KEY no .env.local}

      # Qualidade de vida.
      # Qualidade de vida.
      GENERIC_TIMEZONE: ${TZ:-America/Sao_Paulo}
      TZ: ${TZ:-America/Sao_Paulo}
      N8N_LOG_LEVEL: info
      N8N_RUNNERS_ENABLED: "true"
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/home/node/.n8n/workflows
    networks:
      - nutriaprova-net

  # ─────────────────────────────────────────────────────────────────────────
  # Ollama — runtime de LLM local (Llama 3, Mistral, etc.).
  # Porta 11434 exposta (padrão). Para habilitar GPU NVIDIA descomente o bloco
  # `deploy` abaixo e instale o nvidia-container-toolkit no Debian host.
  # Modelos são baixados pela primeira vez com `docker exec ... ollama pull ...`.
  # ─────────────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: nutriaprova-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - nutriaprova-net
    # Descomente o bloco abaixo se tiver GPU NVIDIA + nvidia-container-toolkit.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ─────────────────────────────────────────────────────────────────────────
  # Redis — fila (BullMQ) + cache de sessão.
  # ─────────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nutriaprova-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD:?defina REDIS_PASSWORD no .env.local}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nutriaprova-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

volumes:
  nutriaprova_db_data:
  n8n_db_data:
  n8n_data:
  ollama_data:
  redis_data:

networks:
  nutriaprova-net:
    driver: bridge
